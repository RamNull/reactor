name: Code Review with Jira Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Job 1: Request code review and update Jira when PR is opened
  request-review-and-update-jira:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jira Issue ID
        id: extract-issue
        run: |
          chmod +x .github/scripts/extract-jira-issue.sh
          .github/scripts/extract-jira-issue.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Request Code Review
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            // Get repository collaborators or team members for review
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = context.issue.number;
            
            // Add a comment to indicate automated review request
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: '🤖 **Automated Code Review Request**\n\nThis pull request has been opened and is ready for review.\n\n' +
                    'Reviewers will be automatically notified. Once the review is complete, the associated Jira ticket (if any) will be updated to "In Review" status.'
            });
            
            console.log('Code review request posted successfully');

      - name: Update Jira Status to In Review
        if: github.event.action == 'opened' && steps.extract-issue.outputs.issue_id != ''
        run: |
          chmod +x .github/scripts/update-jira-status.sh
          .github/scripts/update-jira-status.sh
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_ID: ${{ steps.extract-issue.outputs.issue_id }}
          JIRA_TRANSITION_NAME: ${{ vars.JIRA_REVIEW_STATUS || 'In Review' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  # Job 2: Update Jira when review is completed
  update-jira-on-review:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jira Issue ID
        id: extract-issue
        run: |
          chmod +x .github/scripts/extract-jira-issue.sh
          .github/scripts/extract-jira-issue.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Update Jira Status to Reviewed
        if: steps.extract-issue.outputs.issue_id != ''
        run: |
          chmod +x .github/scripts/update-jira-status.sh
          .github/scripts/update-jira-status.sh
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_ID: ${{ steps.extract-issue.outputs.issue_id }}
          JIRA_TRANSITION_NAME: ${{ vars.JIRA_REVIEWED_STATUS || 'Reviewed' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Add Comment on Jira Update
        if: steps.extract-issue.outputs.issue_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_id = '${{ steps.extract-issue.outputs.issue_id }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Code Review Completed**\n\nThe code review has been approved. Jira issue **${issue_id}** has been updated to "Reviewed" status.`
            });

  # Job 3: Update Jira when PR is merged (completed) or closed
  update-jira-on-completion:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jira Issue ID
        id: extract-issue
        run: |
          chmod +x .github/scripts/extract-jira-issue.sh
          .github/scripts/extract-jira-issue.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Update Jira Status to Done (PR Merged)
        if: github.event.pull_request.merged == true && steps.extract-issue.outputs.issue_id != ''
        run: |
          chmod +x .github/scripts/update-jira-status.sh
          .github/scripts/update-jira-status.sh
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_ID: ${{ steps.extract-issue.outputs.issue_id }}
          JIRA_TRANSITION_NAME: ${{ vars.JIRA_DONE_STATUS || 'Done' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMPLETION_TYPE: "merged"

      - name: Update Jira Status to Closed (PR Closed Without Merge)
        if: github.event.pull_request.merged == false && steps.extract-issue.outputs.issue_id != ''
        run: |
          chmod +x .github/scripts/update-jira-status.sh
          .github/scripts/update-jira-status.sh
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_ID: ${{ steps.extract-issue.outputs.issue_id }}
          JIRA_TRANSITION_NAME: ${{ vars.JIRA_CLOSED_STATUS || 'Closed' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMPLETION_TYPE: "closed"

      - name: Add Comment on PR Completion
        if: steps.extract-issue.outputs.issue_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_id = '${{ steps.extract-issue.outputs.issue_id }}';
            const merged = ${{ github.event.pull_request.merged }};
            const status = merged ? 'Done' : 'Closed';
            const emoji = merged ? '🎉' : '🔒';
            const action = merged ? 'merged' : 'closed without merge';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} **Pull Request ${action.charAt(0).toUpperCase() + action.slice(1)}**\n\nJira issue **${issue_id}** has been updated to "${status}" status.`
            });
